name: Pull Request

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node version to use (e.g. 24)"
        type: string
        required: true
      dotnet-version:
        description: ".NET version to use (e.g. 10.x.x)"
        type: string
        required: true
      aws-region:
        description: "AWS region to deploy to"
        type: string
        required: true
      oidc-role-arn:
        description: "OIDC role to assume"
        type: string
        required: true
      cdk-stack-name:
        description: "Base name of the CDK stack"
        type: string
        required: true
      cdk-dir:
        description: "Directory containing CDK app"
        type: string
        default: "app-stack"
      api-collection-dir:
        description: "Directory containing API collection files"
        type: string
        default: "API Collection"
      source-project-dir:
        description: "Directory of the project containing the source files (e.g. src/MyProject)"
        type: string
        required: true
      unit-tests-project-dir:
        description: "Directory of the project to run unit tests for (e.g. tests/UnitTests)"
        type: string
        required: true
      integration-tests-docker-compose-file:
        description: "Path to the docker-compose file (default docker-compose.yml)"
        type: string
        default: "docker-compose.yml"
      integration-tests-service:
        description: "Name of the docker-compose service that runs the integration tests (default integration_tests)"
        type: string
        default: "integration_tests"

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build Artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: totallymoney/github-workflows/.github/actions/dotnet/build-artifacts@add-dotnet-support
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
          project-dir: ${{ inputs.source-project-dir }}

  unit_tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: totallymoney/github-workflows/.github/actions/dotnet/run-unit-tests@add-dotnet-support
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
          project-dir: ${{ inputs.unit-tests-project-dir }}

  integration_tests:
    name: Run Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: totallymoney/github-workflows/.github/actions/dotnet/run-integration-tests@add-dotnet-support
        with:
          docker-compose-file: ${{ inputs.integration-tests-docker-compose-file }}
          test-service: ${{ inputs.integration-tests-service }}

  deploy:
    name: Deploy to Feature Environment
    needs: [build]
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: totallymoney/github-workflows/.github/actions/cdk/dotnet/deploy-env@add-dotnet-support
        with:
          aws-region: ${{ inputs.aws-region }}
          oidc-role-arn: ${{ inputs.oidc-role-arn }}
          environment: pr-${{ github.event.pull_request.number }}
          node-version: ${{ inputs.node-version }}
          cdk-stack-name: ${{ inputs.cdk-stack-name }}
          cdk-dir: ${{ inputs.cdk-dir }}
          artifact-name: ${{ inputs.artifact-name }}
          artifact-path: ${{ inputs.artifact-path }}

  e2e_tests:
    name: Run E2E Tests on Feature Environment
    needs: [deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: totallymoney/github-workflows/.github/actions/bruno/run-e2e-tests@v1
        with:
          aws-region: ${{ inputs.aws-region }}
          oidc-role-arn: ${{ inputs.oidc-role-arn }}
          environment: pr-${{ github.event.pull_request.number }}
          api-collection-dir: ${{ inputs.api-collection-dir }}
