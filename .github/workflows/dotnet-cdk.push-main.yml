name: Push to Main

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node version to use (e.g. 24)"
        type: string
        required: true
      dotnet-version:
        description: ".NET version to use (e.g. 10.x.x)"
        type: string
        required: true
      aws-region:
        description: "AWS region to deploy to"
        type: string
        required: true
      oidc-role-arn:
        description: "OIDC role to assume"
        type: string
        required: true
      cdk-stack-name:
        description: "Base name of the CDK stack"
        type: string
        required: true
      cdk-dir:
        description: "Directory containing CDK app"
        type: string
        default: "app-stack"
      api-collection-dir:
        description: "Directory containing API collection files"
        type: string
        default: "API Collection"
      version-prefix:
        description: "Version prefix for releases (e.g. '0.2' produces '0.2.{run_number}')"
        type: string
        required: true
      source-project-dir:
        description: "Directory of the project containing the source files (e.g. src/MyProject)"
        type: string
        required: true
      unit-tests-project-dir:
        description: "Directory of the project to run unit tests for (e.g. tests/UnitTests)"
        type: string
        required: true
      integration-tests-docker-compose-file:
        description: "Path to the docker-compose file (default docker-compose.yml)"
        type: string
        default: "docker-compose.yml"
      integration-tests-service:
        description: "Name of the docker-compose service that runs the integration tests (default integration_tests)"
        type: string
        default: "integration_tests"
      artifact-name:
        description: "Name of the prebuilt artifact (e.g. lambda-publish)"
        type: string
        required: true
      artifact-path:
        description: "Directory to extract the artifact into"
        type: string
        default: "publish"
      e2e-env-vars-script:
        description: >
          Optional shell script run before E2E tests. Write key=value lines
          to the 'env-vars' output (via $GITHUB_OUTPUT) to inject extra
          Bruno --env-var values. $ENVIRONMENT is available to the script
          (e.g. stage).
        type: string
        required: false
        default: ""
      e2e-env-vars-script-needs-aws:
        description: "Whether e2e-env-vars-script needs AWS credentials configured before it runs"
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build Artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: totallymoney/github-workflows/.github/actions/dotnet/build-artifacts@v2
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
          project-dir: ${{ inputs.source-project-dir }}
          artifact-name: ${{ inputs.artifact-name }}
          artifact-path: ${{ inputs.artifact-path }}

  unit_tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: totallymoney/github-workflows/.github/actions/dotnet/run-unit-tests@v2
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
          project-dir: ${{ inputs.unit-tests-project-dir }}

  integration_tests:
    name: Run Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: totallymoney/github-workflows/.github/actions/dotnet/run-integration-tests@v2
        with:
          docker-compose-file: ${{ inputs.integration-tests-docker-compose-file }}
          test-service: ${{ inputs.integration-tests-service }}

  release:
    name: Create Release
    needs: [build, unit_tests, integration_tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - id: create_release
        uses: totallymoney/github-workflows/.github/actions/dotnet/create-release@v2
        with:
          version-prefix: ${{ inputs.version-prefix }}
          artifact-name: ${{ inputs.artifact-name }}
          artifact-path: ${{ inputs.artifact-path }}
    outputs:
      version: ${{ steps.create_release.outputs.version }}

  deploy:
    name: Deploy to Stage Environment
    needs: [release]
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-stage
      cancel-in-progress: false
    steps:
      - uses: totallymoney/github-workflows/.github/actions/cdk/dotnet/deploy-env@v2
        with:
          aws-region: ${{ inputs.aws-region }}
          oidc-role-arn: ${{ inputs.oidc-role-arn }}
          environment: stage
          node-version: ${{ inputs.node-version }}
          cdk-stack-name: ${{ inputs.cdk-stack-name }}
          cdk-dir: ${{ inputs.cdk-dir }}
          release-version: ${{ needs.release.outputs.version }}
          artifact-name: ${{ inputs.artifact-name }}
          artifact-path: ${{ inputs.artifact-path }}

  e2e_tests:
    name: Run E2E Tests on Stage Environment
    needs: [deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        if: ${{ inputs.e2e-env-vars-script-needs-aws }}
        uses: aws-actions/configure-aws-credentials@v6.1.2
        with:
          role-to-assume: ${{ inputs.oidc-role-arn }}
          aws-region: ${{ inputs.aws-region }}

      - name: Resolve extra env vars
        id: extra-env-vars
        if: ${{ inputs.e2e-env-vars-script != '' }}
        shell: bash
        env:
          ENVIRONMENT: stage
        run: ${{ inputs.e2e-env-vars-script }}

      - uses: totallymoney/github-workflows/.github/actions/bruno/run-e2e-tests@v1
        with:
          aws-region: ${{ inputs.aws-region }}
          oidc-role-arn: ${{ inputs.oidc-role-arn }}
          environment: stage
          api-collection-dir: ${{ inputs.api-collection-dir }}
          env-vars: ${{ steps.extra-env-vars.outputs.env-vars }}
