name: Run Integration Tests

inputs:
  node-version:
    description: "Node version needed (e.g. 24)"
    required: true
  docker-compose-file:
    description: "Path to a docker-compose file to start before tests (optional)"
    required: false
    default: ""

runs:
  using: composite

  steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Node
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm

    - name: Restore NPM packages
      shell: bash
      run: npm ci

    - name: Start local service containers
      if: inputs.docker-compose-file != ''
      shell: bash
      run: docker compose -f "${{ inputs.docker-compose-file }}" up -d --wait --wait-timeout 60

    - name: Run integration tests
      shell: bash
      run: npm run test:integration
