name: Run Unit Tests

inputs:
  dotnet-version:
    description: ".NET version needed (e.g. 10.x.x)"
    required: true
  project-dir:
    description: "Directory of the project to run tests for (e.g. tests/UnitTests)"
    required: true

runs:
  using: composite

  steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ inputs.dotnet-version }}
        cache: true
        cache-dependency-path: Directory.Packages.props

    - name: Restore .NET tools
      shell: bash
      run: dotnet tool restore

    - name: Run unit tests
      shell: bash
      run: dotnet run --project ${{ inputs.project-dir }} -c Release
