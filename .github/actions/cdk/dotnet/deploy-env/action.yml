name: Deploy Environment

inputs:
  aws-region:
    description: "AWS region to deploy to"
    required: true
  oidc-role-arn:
    description: "OIDC role to assume"
    required: true
  environment:
    description: "Environment to deploy (e.g. stage, prod)"
    required: true
  node-version:
    description: "Node version to use"
    required: true
  release-version:
    description: "Release version (e.g. 0.1.42 — from the GitHub Release tag). Only needed if deploying from a release."
  cdk-dir:
    description: "Directory containing CDK app"
    default: "app-stack"
  cdk-stack-name:
    description: "Base name of the CDK stack (environment will be appended, e.g. 'my-app' → 'my-app-stage')"
    required: true
  artifact-name:
    description: "Name of a prebuilt-code artifact to fetch before deploying. Omit for apps where CDK bundles the code itself (e.g. NodejsFunction)."
    required: true
  artifact-path:
    description: "Directory to extract the artifact into"
    default: "publish"

runs:
  using: composite

  steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        ref: ${{ inputs.release-version || github.ref }}

    # Used when deploying a specific release (e.g. push-main.yml's deploy job, or a manual
    # deploy that targets an already-published version) — pulls the zip from the GitHub Release.
    - name: Download artifact from release
      if: inputs.release-version != ''
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release download "${{ inputs.release-version }}" --pattern "${{ inputs.artifact-name }}.zip"
        unzip "${{ inputs.artifact-name }}.zip" -d "${{ inputs.artifact-path }}/"

    # Used when no release-version is given (e.g. pull-request.yml's feature-env deploy) —
    # pulls the artifact uploaded earlier in the same workflow run.
    - name: Download artifact from previous job
      if: inputs.release-version == ''
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.artifact-path }}/

    - name: Set up Node
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: ${{ inputs.cdk-dir }}/package-lock.json

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6.1.2
      with:
        role-to-assume: ${{ inputs.oidc-role-arn }}
        aws-region: ${{ inputs.aws-region }}

    - name: Install CDK dependencies
      working-directory: ${{ inputs.cdk-dir }}
      shell: bash
      run: npm ci

    - name: Deploy CDK stack
      working-directory: ${{ inputs.cdk-dir }}
      env:
        VERSION: ${{ inputs.release-version || '0.0.0' }}
        ENVIRONMENT: ${{ inputs.environment }}
      shell: bash
      run: npx cdk deploy "${{ inputs.cdk-stack-name }}-${{ inputs.environment }}" --require-approval never
