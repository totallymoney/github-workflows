name: Run End-to-End Tests

inputs:
  aws-region:
    description: "AWS region to deploy to"
    required: true
  oidc-role-arn:
    description: "OIDC role to assume"
    required: true
  environment:
    description: "Environment to run tests against (e.g. stage, prod)"
    required: true
  env-vars:
    description: "Additional Bruno --env-var values, one per line as key=value"
    required: false
    default: ""
  api-collection-dir:
    description: "Directory containing API collection files"
    default: "API Collection"
  prod-tag:
    description: "Bruno tag used to filter tests when running against prod"
    default: "prod-safe"

runs:
  using: composite

  steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6.1.2
      with:
        role-to-assume: ${{ inputs.oidc-role-arn }}
        aws-region: ${{ inputs.aws-region }}

    - name: Install Bruno CLI
      shell: bash
      run: npm install -g @usebruno/cli@3.4.2

    - name: Run API collection for Prod
      if: ${{ inputs.environment == 'prod' }}
      working-directory: ${{ inputs.api-collection-dir }}
      shell: bash
      env:
        BRUNO_ENVIRONMENT: ${{ inputs.environment }}
        BRUNO_EXTRA_VARS: ${{ inputs.env-vars }}
      run: |
        args=(--env-var "envName=$BRUNO_ENVIRONMENT")
        while IFS= read -r line; do
          [ -n "$line" ] && args+=(--env-var "$line")
        done <<< "$BRUNO_EXTRA_VARS"
        bru run "${args[@]}" --tags "${{ inputs.prod-tag }}"

    - name: Run API collection for Non-Prod
      if: ${{ inputs.environment != 'prod' }}
      working-directory: ${{ inputs.api-collection-dir }}
      shell: bash
      env:
        BRUNO_ENVIRONMENT: ${{ inputs.environment }}
        BRUNO_EXTRA_VARS: ${{ inputs.env-vars }}
      run: |
        args=(--env-var "envName=$BRUNO_ENVIRONMENT")
        while IFS= read -r line; do
          [ -n "$line" ] && args+=(--env-var "$line")
        done <<< "$BRUNO_EXTRA_VARS"
        bru run "${args[@]}"
