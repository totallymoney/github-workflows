name: Pull Request

on:
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    uses: totallymoney/github-workflows/.github/workflows/node-cdk.pull-request.yml@v1
    with:
      node-version: ${{ vars.NODE_VERSION }}
      aws-region: ${{ vars.AWS_REGION }}
      oidc-role-arn: ${{ vars.OIDC_ROLE_ARN }}
      cdk-stack-name: ${{ vars.CDK_STACK_NAME }}
      # Optional: path to a docker-compose file to start before integration tests
      # integration-tests-docker-compose-file: "docker-compose.yml"
      # Optional: run Bruno E2E tests in developer sandbox mode (needed for scripts using external npm packages or filesystem/network access)
      # e2e-sandbox-developer-mode: true
