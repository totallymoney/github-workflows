name: Pull Request

on:
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    uses: totallymoney/github-workflows/.github/workflows/dotnet-cdk.pull-request.yml@v1
    with:
      node-version: ${{ vars.NODE_VERSION }}
      dotnet-version: ${{ vars.DOTNET_VERSION }}
      aws-region: ${{ vars.AWS_REGION }}
      oidc-role-arn: ${{ vars.OIDC_ROLE_ARN }}
      cdk-stack-name: ${{ vars.CDK_STACK_NAME }}
      source-project-dir: "src/MyProject"
      unit-tests-project-dir: "tests/UnitTests"
      artifact-name: "lambda-publish"
      # Optional: docker-compose file/service to start before integration tests
      # integration-tests-docker-compose-file: "docker-compose.yml"
      # integration-tests-service: "integration_tests"
