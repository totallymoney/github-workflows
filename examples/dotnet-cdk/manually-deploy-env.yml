name: Manually Deploy Environment

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to deploy (e.g. 0.1.42)"
        type: string
        required: true
      environment:
        description: "Environment to deploy to"
        type: choice
        options:
          - stage
          - prod

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    uses: totallymoney/github-workflows/.github/workflows/dotnet-cdk.manually-deploy-env.yml@v1
    with:
      version: ${{ inputs.version }}
      environment: ${{ inputs.environment }}
      node-version: ${{ vars.NODE_VERSION }}
      aws-region: ${{ vars.AWS_REGION }}
      oidc-role-arn: ${{ vars.OIDC_ROLE_ARN }}
      cdk-stack-name: ${{ vars.CDK_STACK_NAME }}
      artifact-name: "lambda-publish"
      # Optional: skip the Bruno E2E tests, for services with no API collection to test (e.g. queue-driven Lambdas)
      # run-e2e-tests: false
